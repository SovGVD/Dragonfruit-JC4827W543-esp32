# M5Paper GT911 digitizer sensitivity — FACTORY DEFAULTS
#
# These are the stock values Goodix/M5Stack flash on the standard M5Paper
# (v1.1, 540x960 panel). Source: the GT911 config block published in M5Stack's
# M5EPD library (src/utility/GT911.cpp, array _kGT911FW540960G2T1602729168),
# read at the offsets this firmware exposes (see components/input/touch_config.c).
#
# TO RESTORE FACTORY TOUCH BEHAVIOR:
#   Copy this file to the SD card root as "/digitizer.cfg" and reboot. The
#   firmware re-applies these values to the GT911 on every boot, so this puts
#   the panel back to stock regardless of what you'd changed it to.
#
# Each value is a single byte (0-255). Edit and reboot to apply. Delete
# /digitizer.cfg and reboot to let the firmware regenerate it from the chip.
#
# NOTE: these are correct for the standard M5Paper. A different panel revision
# (e.g. Comm edition) may ship a different config; if unsure, delete the file,
# reboot, and read back the values the firmware logs / writes.

# Touch debounce: how many consecutive scan samples must agree before a touch
# is reported. Lower = snappier / more responsive (factory choice); higher =
# fewer spurious taps from noise, at the cost of a little input latency.
shake_count     = 1    # samples to confirm a touch (debounce)

# Coordinate smoothing applied to the reported x/y. Higher = steadier point
# (less jitter when holding still) but more lag and blunted fast strokes;
# lower = rawer, more reactive coordinates that may jitter slightly.
filter          = 24   # coordinate smoothing

# Large-area touch rejection: the number of simultaneously-active sense nodes
# above which the input is treated as a palm/cheek/water blob and ignored.
# Higher = harder to trigger rejection (lets bigger contacts through);
# lower = more aggressive palm rejection.
large_touch     = 40   # large-area touch count

# Noise floor / electrical-noise suppression. Higher = better immunity to
# interference (e.g. while charging or near a noisy supply) but dulls light
# touches; lower = more sensitive to faint contacts but more noise-prone.
noise_reduction = 15   # noise floor

# Press threshold: the signal strength a contact must exceed to register a
# touch-DOWN. LOWER = MORE SENSITIVE (catches lighter taps, but risks false
# touches); higher = needs firmer contact. Must stay ABOVE leave_level.
touch_level     = 80   # press threshold; lower = more sensitive

# Release threshold: the signal must drop below this for a held touch to count
# as a touch-UP. Must be LESS than touch_level — the gap between the two is the
# hysteresis band that stops a touch near the threshold from flickering
# down/up. Wider gap = stickier touches; narrower gap = quicker release.
leave_level     = 50   # release threshold; must be < touch_level
